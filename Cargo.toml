[workspace]
members = ["crates/weft-domain", "crates/weft-native-git"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/4mGLn/weft"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
