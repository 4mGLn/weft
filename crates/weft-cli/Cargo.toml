[package]
name = "weft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "weft"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
weft-artifact = { path = "../weft-artifact" }
weft-domain = { path = "../weft-domain" }
weft-provider-git = { path = "../weft-provider-git" }
weft-provider-gitbutler = { path = "../weft-provider-gitbutler" }
weft-storage-sqlite = { path = "../weft-storage-sqlite" }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
