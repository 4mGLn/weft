name: Runtime release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag identity
        env:
          TAG_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 2
          fi
          git fetch origin main
          TAG_COMMIT="$(git rev-list -n 1 "$VERSION")"
          test "$TAG_COMMIT" = "$TAG_SHA"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
      - name: Verify repository
        run: make check
      - name: Build and test runtime archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          make package-release VERSION="$VERSION"
          make test-release ARCHIVE="dist/weft-${VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
          make test-release-reproducibility VERSION="$VERSION"
      - name: Verify upgrade and rollback from the latest prior runtime
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          BASELINE_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -z "$BASELINE_TAG" ]; then
            echo "no prior public runtime; upgrade checkpoint is not applicable"
            exit 0
          fi
          BASELINE_VERSION="${BASELINE_TAG#v}"
          gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "weft-${BASELINE_VERSION}-x86_64-unknown-linux-gnu.*" --dir dist/previous
          make test-upgrade-rollback FROM_ARCHIVE="dist/previous/weft-${BASELINE_VERSION}-x86_64-unknown-linux-gnu.tar.gz" TO_ARCHIVE="dist/weft-${VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
      - name: Attest runtime archive
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/weft-*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" "dist/weft-${VERSION#v}-x86_64-unknown-linux-gnu.tar.gz" --verify-tag --generate-notes
