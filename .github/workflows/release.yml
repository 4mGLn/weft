name: Runtime release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag identity
        env:
          TAG_SHA: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 2
          fi
          git fetch origin main
          TAG_COMMIT="$(git rev-list -n 1 "$VERSION")"
          test "$TAG_COMMIT" = "$TAG_SHA"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main
      - name: Verify repository
        run: make check
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare portable Linux toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build and test runtime archive
        env:
          VERSION: ${{ github.ref_name }}
          WEFT_RELEASE_TARGET: ${{ matrix.target }}
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          make package-release VERSION="$VERSION"
          make test-release ARCHIVE="dist/weft-${VERSION#v}-${WEFT_RELEASE_TARGET}.tar.gz"
          make test-release-reproducibility VERSION="$VERSION"
      - name: Verify upgrade and rollback from the latest prior runtime
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          BASELINE_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -z "$BASELINE_TAG" ]; then
            echo "no prior public runtime; upgrade checkpoint is not applicable"
            exit 0
          fi
          BASELINE_VERSION="${BASELINE_TAG#v}"
          gh release download "$BASELINE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "weft-${BASELINE_VERSION}-x86_64-unknown-linux-gnu.*" --dir dist/previous
          make test-upgrade-rollback FROM_ARCHIVE="dist/previous/weft-${BASELINE_VERSION}-x86_64-unknown-linux-gnu.tar.gz" TO_ARCHIVE="dist/weft-${VERSION#v}-${WEFT_RELEASE_TARGET}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.target }}
          path: dist/weft-*.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Attest runtime archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/weft-*.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/weft-*.tar.gz --verify-tag --generate-notes
