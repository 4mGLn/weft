name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify repository harness and documentation
        run: make check
      - name: Verify Native Git feasibility contract
        run: make phase0-native-git-spike
