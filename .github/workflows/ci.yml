name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-runtime-archive:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Windows runtime archive
        shell: bash
        run: |
          VERSION="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          WEFT_RELEASE_TARGET=x86_64-pc-windows-msvc bash scripts/package-release.sh "$VERSION"
      - name: Smoke test Windows archive installation
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $archive = "dist/weft-$version-x86_64-pc-windows-msvc.tar.gz"
          $root = Join-Path $env:RUNNER_TEMP 'weft-windows-runtime-smoke'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          tar -xzf $archive -C $root
          $package = Get-ChildItem -LiteralPath $root -Directory -Filter 'weft-*' | Select-Object -First 1
          $prefix = Join-Path $root 'install'
          & (Join-Path $package.FullName 'install.ps1') -Prefix $prefix
          & (Join-Path $prefix 'bin/weft.exe') --version
  repository-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify repository harness and documentation
        run: make check
      - name: Verify Native Git feasibility contract
        run: make phase0-native-git-spike
      - name: Build and smoke-test deployable archive
        env:
          GH_TOKEN: ${{ github.token }}
          WEFT_RELEASE_TARGET: x86_64-unknown-linux-musl
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          VERSION="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          make package-release VERSION="$VERSION"
          make test-release ARCHIVE="dist/weft-${VERSION#v}-${WEFT_RELEASE_TARGET}.tar.gz"
          make test-release-reproducibility VERSION="$VERSION"
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern 'weft-0.1.0-x86_64-unknown-linux-gnu.*' --dir dist/v0.1.0
          make test-upgrade-rollback FROM_ARCHIVE=dist/v0.1.0/weft-0.1.0-x86_64-unknown-linux-gnu.tar.gz TO_ARCHIVE="dist/weft-${VERSION#v}-${WEFT_RELEASE_TARGET}.tar.gz"
