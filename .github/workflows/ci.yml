name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify repository harness and documentation
        run: make check
      - name: Verify Native Git feasibility contract
        run: make phase0-native-git-spike
      - name: Install GitButler CLI
        run: |
          curl -fsSL https://gitbutler.com/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify GitButler feasibility contract
        run: make phase0-gitbutler-spike
