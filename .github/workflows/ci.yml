name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Verify repository harness and documentation
        run: make check
      - name: Verify Native Git feasibility contract
        run: make phase0-native-git-spike
      - name: Build and smoke-test deployable archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          make package-release VERSION="$VERSION"
          make test-release ARCHIVE="dist/weft-${VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
          make test-release-reproducibility VERSION="$VERSION"
          gh release download v0.1.0 --repo "$GITHUB_REPOSITORY" --pattern 'weft-0.1.0-x86_64-unknown-linux-gnu.*' --dir dist/v0.1.0
          make test-upgrade-rollback FROM_ARCHIVE=dist/v0.1.0/weft-0.1.0-x86_64-unknown-linux-gnu.tar.gz TO_ARCHIVE="dist/weft-${VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
